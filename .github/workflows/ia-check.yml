name: Home IA

# Hard check for homepage section order, six nav labels, and the 15 news URLs.
# See docs/FEATURE-MAP.md and tests/ia-check.mjs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run IA checks
        run: npm test
