name: IndexNow

# Tell Bing and other IndexNow engines about new or updated HTML pages.
# The key file is public by design. A non-2xx API response is logged and
# does not fail this job, so it cannot block GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: false

jobs:
  submit:
    name: Submit changed HTML URLs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: POST URL list to IndexNow
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: python3 .github/scripts/indexnow_submit.py
