<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 智能体是个啥？想→做→看 小实验</title>
<style>body{font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;background:#faf7f0;color:#1e1e28;margin:0 auto;padding:20px;max-width:540px}
h1{font-size:24px;margin:6px 0}.card{background:#fff;border-radius:12px;padding:14px;margin:12px 0}
select{font-size:16px;padding:8px;border-radius:8px;width:100%}
label{display:block;margin:8px 0;font-size:16px}button{font-size:17px;padding:10px 16px;border:0;border-radius:10px;background:#ff5252;color:#fff;margin:6px 6px 0 0}button.g{background:#1e1e28}
.step{padding:8px 10px;border-radius:8px;margin:6px 0;font-size:15px;line-height:1.6;opacity:0;transform:translateY(6px);transition:all .35s}
.step.on{opacity:1;transform:none}.t{background:#e6eeff}.a{background:#fff0e1}.o{background:#e1f5eb}.fin{background:#ffecec;font-weight:bold}.warn{background:#fff6cc}
.tag{display:inline-block;min-width:34px;text-align:center;border-radius:6px;color:#fff;font-weight:bold;margin-right:6px}
.tt{background:#466ee6}.ta{background:#dc781e}.to{background:#28a06e}.tf{background:#ff5252}.tw{background:#c9a000}
.note{color:#6e6e78;font-size:13px;margin-top:16px}input[type=range]{width:60%}</style></head><body>
<h1>AI 智能体是个啥？🤖</h1>
<p>智能体 = 大模型（大脑🧠）+ 工具（手脚🛠️）+ 一轮轮「想 → 做 → 看」的循环🔁。选个任务，开关工具，看看它会怎么干活。</p>
<div class="card"><b>📋 交给它的任务</b>
<select id="task"><option value="umbrella">周六去公园，要不要带伞？</option><option value="aa">3 个人聚餐花了 287 元，AA 每人多少？</option><option value="meet">帮我把“读书会”约到周五晚上 8 点</option></select></div>
<div class="card"><b>🛠️ 给它哪些工具</b>
<label><input type="checkbox" id="weather" checked> 🌦️ 天气查询</label>
<label><input type="checkbox" id="calc" checked> 🧮 计算器</label>
<label><input type="checkbox" id="cal" checked> 📅 日历</label>
<label><input type="checkbox" id="ask" checked> 🙋 写入日历前先问我</label>
<label>🔁 最多跑几轮：<input type="range" id="max" min="1" max="4" value="4"> <b id="mv">4</b></label></div>
<button id="go">▶️ 让智能体开工</button><button class="g" id="reset">重来</button>
<div class="card" id="log">（点“让智能体开工”开始）</div>
<p class="note">说明：这是一个用规则写的模拟演示，不是真的大模型；天气结果、日历都是示意数据，不连接任何真实服务。真实智能体每一步由大模型自己决定，结果带随机性，也可能出错。原理参考 Yao 等人的 ReAct 论文（推理 + 行动交替进行）和 Anthropic《Building effective agents》（智能体就是大模型在循环里根据环境反馈使用工具）。</p>
<script>
const $=id=>document.getElementById(id);
$("max").oninput=()=>$("mv").textContent=$("max").value;
const T=(c,tag,txt)=>({c,tag,txt});
function plan(){
 const k=$("task").value,w=$("weather").checked,c=$("calc").checked,cal=$("cal").checked,ask=$("ask").checked;
 if(k==="umbrella"){
  if(!w) return [T("t","想","要回答带不带伞，得知道周六天气。"),T("t","想","可我手上没有天气工具……"),T("fin","答","⚠️ 我查不到天气，只能建议你自己看预报。（没有工具，它就退回成“只会说”的聊天 AI）")];
  return [T("t","想","要知道周六天气，才能决定带不带伞。"),T("a","做","调用 🌦️ 天气查询（城市=本地，日期=周六）"),T("o","看","返回：周六下午有阵雨（示意数据）"),T("t","想","有雨，信息够了，可以交差。"),T("fin","答","✅ 建议带伞☂️，下午可能有阵雨（示意）。")];
 }
 if(k==="aa"){
  if(!c) return [T("t","想","287 ÷ 3，我心算一下……"),T("fin","答","⚠️ 大概 95 块吧？（没用计算器，大模型“心算”容易不准，真实答案是 95.67）")];
  return [T("t","想","这是除法，交给计算器更靠谱。"),T("a","做","调用 🧮 计算器：287 ÷ 3"),T("o","看","返回：95.666…"),T("t","想","保留两位小数就行，可以交差。"),T("fin","答","✅ 每人约 95.67 元。")];
 }
 if(!cal) return [T("t","想","要把读书会放进日历，可我没有日历工具。"),T("fin","答","⚠️ 我做不到，只能提醒你自己去日历里加。")];
 const s=[T("t","想","先看看周五晚上 8 点有没有冲突。"),T("a","做","调用 📅 日历：查询周五 20:00"),T("o","看","返回：周五 20:00 已有“健身课”（示意数据）"),T("t","想","有冲突！换成周五 21:00 试试。"),T("a","做","调用 📅 日历：查询周五 21:00"),T("o","看","返回：这个时间是空的")];
 if(ask) s.push(T("w","问","🙋 “8 点有健身课，改到 9 点可以吗？确认后我再写入日历。”"),T("fin","答","✅（假设你点了确认）读书会已约在周五 21:00（示意）。"));
 else s.push(T("a","做","调用 📅 日历：写入“读书会 周五 21:00”"),T("fin","答","🟡 已自己改到 21:00 并写进日历——没问你就改了时间，这就是为什么关键动作要让它先问你。"));
 return s;
}
let timer=null;
$("go").onclick=()=>{
 clearInterval(timer);const steps=plan(),max=+$("max").value;let rounds=0,out=[];
 for(const s of steps){ if(s.tag==="想"){rounds++; if(rounds>max){out.push(T("w","停",`⛔ 已跑满 ${max} 轮，触发“停止条件”，任务没做完，先停下来交给你。`));break;}} out.push(s); }
 const tagc={想:"tt",做:"ta",看:"to",答:"tf",问:"tw",停:"tw"},cls={t:"t",a:"a",o:"o",fin:"fin",w:"warn"};
 $("log").innerHTML=out.map(s=>`<div class="step ${cls[s.c]}"><span class="tag ${tagc[s.tag]}">${s.tag}</span>${s.txt}</div>`).join("")+`<div class="step" style="color:#6e6e78">共 ${Math.min(rounds,max)} 轮「想」</div>`;
 const els=[...document.querySelectorAll(".step")];let i=0;
 timer=setInterval(()=>{if(i<els.length)els[i++].classList.add("on");else clearInterval(timer)},700);
};
$("reset").onclick=()=>{clearInterval(timer);["weather","calc","cal","ask"].forEach(i=>$(i).checked=true);$("max").value=4;$("mv").textContent=4;$("task").value="umbrella";$("log").textContent="（点“让智能体开工”开始）"};
</script></body></html>
